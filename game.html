<!DOCTYPE html>
 <html lang="zh-CN">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>猜游戏角色</title>
     <style>
         * {
             margin: 0;
             padding: 0;
             box-sizing: border-box;
             font-family: system-ui, sans-serif;
         }
         body {
             background-color: #1f2937;
             color: #fff;
             min-height: 100vh;
             display: flex;
             justify-content: center;
             align-items: center;
             padding:16px;
         }
         .game-wrap {
             width: 100%;
             max-width:420px;
             background:#2d3748;
             border-radius:16px;
             padding:28px 24px;
         }
         .score-bar{
             display:flex;
             justify-content: space-between;
             margin-bottom:20px;
             font-size:15px;
             color:#cbd5e0;
         }
         .tip-block{
             background:#374151;
             border-radius:12px;
             padding:18px;
             margin-bottom:24px;
         }
         .tip-title{
             font-size:14px;
             color:#9ca3af;
             margin-bottom:8px;
         }
         .tip-text{
             font-size:17px;
             line-height:1.6;
         }
         .option-item{
             width:100%;
             padding:14px;
             margin-bottom:12px;
             border:1px solid #4b5563;
             background:#374151;
             color:#fff;
             border-radius:10px;
             font-size:16px;
             cursor:pointer;
             transition:0.18s;
         }
         .option-item:hover{
             background:#4b5563;
         }
         .option-item.right{
             background:#059669;
             border-color:#059669;
         }
         .option-item.wrong{
             background:#dc2626;
             border-color:#dc2626;
         }
         .result-text{
             text-align:center;
             margin:16px 0;
             font-size:16px;
             min-height:24px;
         }
         .btn-next{
             width:100%;
             padding:13px;
             background:#3b82f6;
             color:white;
             border:none;
             border-radius:10px;
             font-size:16px;
             cursor:pointer;
             margin-top:8px;
         }
         .btn-next:disabled{
             background:#475569;
             cursor:not-allowed;
         }
         .end-box{
             text-align:center;
         }
         .end-box h2{
             margin-bottom:12px;
         }
         .hide{
             display:none !important;
         }
     </style>
 </head>
 <body>
 <div class="game-wrap">
     <div class="score-bar">
         <span>得分：<span id="score">0</span></span>
         <span>题目 <span id="current">1</span> / <span id="total">0</span></span>
     </div>
     <div id="quiz-area">
         <div class="tip-block">
             <div class="tip-title">角色线索</div>
             <div class="tip-text" id="hint">--</div>
         </div>
         <div id="option-box"></div>
         <div class="result-text" id="msg"></div>
         <button class="btn-next" id="nextBtn" disabled>下一题</button>
     </div>
     <div id="end-area" class="end-box hide">
    <h2>游戏结束</h2>
    <p>你的最终得分：<span id="final-score">0</span></p>
    <br>
    <button class="btn-next" id="restartBtn">重新开始</button>
    <button class="btn-next" id="exitBtn" style="margin-top:10px;background:#6b7280;">退出游戏</button>
</div>
 </div>
 <script>
 // 题库，你可以自由增删题目
 const questionList = [
     // 明日方舟
 {
     hint:"萨卡兹双子魔王之一，想消除萨卡兹千百年的仇恨，最终死在博士面前",
     answer:"特蕾西娅",
     options:["阿米娅","霜星","特蕾西娅","可露希尔"]
 },
 // 碧蓝档案
 {
     hint:"（一周目）独自一人面对债务与外敌，手握所有阿拜多斯成员的学生牌倒下",
     answer:"砂狼白子",
     options:["砂狼白子","小鸟游星野","浅黄睦月","黑馆羽留奈"]
 },
 // 崩坏3
 {
     hint:"最后一课-至少这一次，以自己的方式活下去吧",
     answer:"姬子",
     options:["芽衣","琪亚娜","姬子","德丽莎"]
 },
 // 少女前线
 {
     hint:"可惜是分别的时候了，M4A1，这种琐事已经来不及计算了",
     answer:"AR‑15",
     options:["AR‑15","M4A1","M16A1","RO635"]
 },
 // 东方幻想乡
 {
     hint:"曾是大小姐，操纵死亡最终绝望自杀成为冥界的亡灵公主",
     answer:"西行寺幽幽子",
     options:["博丽灵梦","雾雨魔理沙","西行寺幽幽子","蕾米莉亚"]
 }
 ];
 let currentIndex = 0;
 let score = 0;
 let isAnswered = false;
 const quizArea = document.getElementById("quiz-area");
 const endArea = document.getElementById("end-area");
 const hintDom = document.getElementById("hint");
 const optionBox = document.getElementById("option-box");
 const msgDom = document.getElementById("msg");
 const scoreDom = document.getElementById("score");
 const currentDom = document.getElementById("current");
 const totalDom = document.getElementById("total");
 const nextBtn = document.getElementById("nextBtn");
 const restartBtn = document.getElementById("restartBtn");
 const finalScoreDom = document.getElementById("final-score");
 totalDom.innerText = questionList.length;
 //渲染单题
 function renderQuestion(){
     isAnswered = false;
     msgDom.innerText = "";
     nextBtn.disabled = true;
     const q = questionList[currentIndex];
     hintDom.innerText = q.hint;
     currentDom.innerText = currentIndex + 1;
     optionBox.innerHTML = "";
     q.options.forEach(opt=>{
         const btn = document.createElement("button");
         btn.className = "option-item";
         btn.innerText = opt;
         btn.onclick = ()=>handleSelect(opt, q.answer, btn);
         optionBox.appendChild(btn);
     })
 }
 //选择答案
 function handleSelect(selected, correct, btnEl){
     if(isAnswered) return;
     isAnswered = true;
     const allOpts = document.querySelectorAll(".option-item");
     allOpts.forEach(b=>b.disabled=true);
     if(selected === correct){
         btnEl.classList.add("right");
         msgDom.innerText = "✅回答正确！";
         score += 20;
         scoreDom.innerText = score;
     }else{
         btnEl.classList.add("wrong");
         msgDom.innerText = `❌答错，正确答案：${correct}`;
         //找到正确答案标绿
         allOpts.forEach(b=>{
             if(b.innerText === correct) b.classList.add("right");
         })
     }
     nextBtn.disabled = false;
 }
 //下一题
 nextBtn.onclick = function(){
     currentIndex++;
     if(currentIndex >= questionList.length){
         showEnd();
     }else{
         renderQuestion();
     }
 }
 //结束界面
 function showEnd(){
     quizArea.classList.add("hide");
     endArea.classList.remove("hide");
     finalScoreDom.innerText = score;
      document.getElementById("exitBtn").onclick = function(){
        // 如果history.back失效，尝试关闭窗口，不行就跳转回主页
        if(window.history.length>1){
            window.history.back();
        }else{
            window.location.href="./index.html";
        }
    };
}
 //重新开局
 restartBtn.onclick = function(){
     currentIndex = 0;
     score = 0;
     scoreDom.innerText = 0;
     quizArea.classList.remove("hide");
     endArea.classList.add("hide");
     renderQuestion();
 }
 //启动游戏
 renderQuestion();
 </script>
 </body>
 </html>
